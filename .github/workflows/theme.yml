name: Theme package

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s eng -p 'test_*.py'
      - name: Build and check the package
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            python eng/build.py --tag "$GITHUB_REF_NAME"
          else
            python eng/build.py
          fi
          cd dist
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: liuli-ntp
          path: |
            dist/*.ntp
            dist/SHA256SUMS
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: liuli-ntp
          path: dist
      - name: Publish the verified NTP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && sha256sum -c SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" dist/*.ntp dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Liuli $GITHUB_REF_NAME" \
            --notes '下载 .ntp 文件，在 NexaCL 的「设置 → 外观与主题 → 导入主题包」中安装。SHA256SUMS 提供附件校验值。'
